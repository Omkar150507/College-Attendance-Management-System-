{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>My Profile</h1><p>Update your name, mobile number and password.</p></div></div><div class="panel"><form method="post" class="form-grid"><div><label>Username</label><input value="{{user.username}}" disabled></div><div><label>Role</label><input value="{{user.role|title}}" disabled></div><div><label>Full Name</label><input name="full_name" value="{{user.full_name or ''}}" required></div><div><label>Mobile</label><input name="mobile" value="{{user.mobile or ''}}"></div><div><label>New Password (optional)</label><input type="password" name="new_password" placeholder="Leave blank to keep current password"></div><div><button class="primary">Save Profile</button></div></form></div>{% endblock %}
