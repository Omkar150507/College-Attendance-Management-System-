{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>System Settings</h1><p>College attendance rules and academic year.</p></div></div><div class="panel"><form method="post" class="form-grid"><div><label>Low Attendance Threshold (%)</label><input type="number" min="0" max="100" name="threshold" value="{{settings.get('attendance_threshold','75')}}" required></div><div><label>Academic Year</label><input name="academic_year" value="{{settings.get('academic_year','')}}" placeholder="2026-27"></div><div><button class="primary">Save Settings</button></div></form></div>{% endblock %}
