{% extends "base.html" %}
{% block content %}
<div class="content-wrap subject-form-page">
  <div class="page-banner">
    <div class="page-banner-icon">▥</div>
    <div class="page-banner-copy">
      <h1>{{ title }}</h1>
      <p>Create or update a B.Pharm subject with a clean mobile-friendly form.</p>
    </div>
    <a class="button" href="{{ url_for('subjects') }}">← Back to Subjects</a>
  </div>

  <section class="panel subject-form-card">
    <div class="form-title">
      <div class="form-title-icon">📚</div>
      <div>
        <h2>Subject Information</h2>
        <p>All fields are required.</p>
      </div>
    </div>

    <form method="post" class="subject-form-grid">
      <div class="field-block">
        <label for="year">Academic Year</label>
        <select id="year" name="year" required>
          <option value="">Select academic year</option>
          {% for y in years %}
          <option value="{{ y }}" {% if subject and subject.year==y %}selected{% endif %}>{{ y }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field-block">
        <label for="code">Subject Code</label>
        <input id="code" name="code" value="{{ subject.code if subject else '' }}" required placeholder="Example: BP501T" autocomplete="off">
        <small>Use the official university subject code.</small>
      </div>

      <div class="field-block full-field">
        <label for="name">Subject Name</label>
        <input id="name" name="name" value="{{ subject.name if subject else '' }}" required placeholder="Example: Medicinal Chemistry-II" autocomplete="off">
      </div>

      <div class="form-actions full-field">
        <a class="button" href="{{ url_for('subjects') }}">Cancel</a>
        <button type="submit" class="primary">✓ Save Subject</button>
      </div>
    </form>
  </section>
</div>

<style>
.subject-form-page{max-width:1000px;margin:0 auto;padding-bottom:30px}
.subject-form-card{margin-top:16px;padding:24px}
.form-title{display:flex;align-items:center;gap:14px;padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid #e6edf5}
.form-title-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#eaf4ff;font-size:23px}
.form-title h2{margin:0;font-size:20px}.form-title p{margin:4px 0 0;color:#718096}
.subject-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field-block{display:flex;flex-direction:column;gap:7px}.field-block label{font-weight:700;color:#17324d;font-size:14px}
.field-block input,.field-block select{width:100%;box-sizing:border-box;min-height:46px;border:1px solid #cfd9e5;border-radius:10px;padding:0 13px;background:#fff;font-size:15px;outline:none}
.field-block input:focus,.field-block select:focus{border-color:#1677d2;box-shadow:0 0 0 3px rgba(22,119,210,.10)}
.field-block small{color:#7a8795;font-size:12px}.full-field{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:4px;padding-top:8px}
@media(max-width:700px){.subject-form-page{padding:0 4px 25px}.page-banner{flex-wrap:wrap}.page-banner .button{width:100%;text-align:center;box-sizing:border-box}.subject-form-card{padding:17px}.subject-form-grid{grid-template-columns:1fr;gap:15px}.full-field{grid-column:auto}.form-actions{justify-content:stretch}.form-actions .button,.form-actions button{flex:1;text-align:center}.field-block input,.field-block select{min-height:48px}}
</style>
{% endblock %}
