{% extends "base.html" %}{% block content %}<div class="content-wrap"><div class="page-banner"><div class="page-banner-icon">☷</div><div class="page-banner-copy"><h1>Activity Log</h1><p>Track important administrator, teacher and system actions.</p></div></div><div class="panel"><form method="get" class="filters" style="grid-template-columns:1fr auto"><div><label>Search Activity</label><input name="q" value="{{q}}" placeholder="Search user, action or details"></div><div><button class="primary">Filter</button></div></form></div><div class="panel"><div class="panel-head"><h2>Recent Activity</h2></div><div class="table-wrap"><table class="modern-table"><thead><tr><th>Date / Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.created_at}}</td><td><strong>{{r.username}}</strong></td><td><span class="status-badge neutral">{{r.action}}</span></td><td>{{r.details}}</td></tr>{% else %}<tr><td colspan="4" class="muted">No activity found.</td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
