{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>Student Report</h1><p>PRN: {{student.prn or "—"}} — {{student.name}}</p></div></div><div class="panel"><table><tr><th>Subject</th><th>Total</th><th>Present</th><th>Absent</th><th>Attendance</th></tr>{% for r in rows %}<tr><td>{{r.code}} - {{r.name}}</td><td>{{r.total}}</td><td>{{r.present}}</td><td>{{r.absent}}</td><td>{{r.pct}}%</td></tr>{% endfor %}</table></div>{% endblock %}
